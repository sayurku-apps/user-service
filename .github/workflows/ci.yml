# Tiap push/PR: compile + jalankan tes + pastikan Dockerfile masih bisa di-build.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    # Tes butuh Postgres sungguhan (Flyway menjalankan migrasi ke database kosong ini)
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sayurku_user_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    # application-local.properties tidak ada di repo, jadi konfigurasinya lewat env var
    env:
      SPRING_DATASOURCE_PASSWORD: postgres
      JWT_SECRET: ci-jwt-secret-minimal-32-karakter-0123456789
      INTERNAL_TOKEN: ci-internal-token
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '26'
          cache: maven

      - name: Tes
        run: chmod +x mvnw && ./mvnw -B verify

      - name: Build image Docker
        run: docker build -t ${{ github.event.repository.name }}:ci .
